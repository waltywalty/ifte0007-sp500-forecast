[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ifte0007-forecast"
version = "0.1.0"
description = "Offline, auditable S&P 500 coursework forecasting research"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.0.6",
  "scipy==1.16.3",
  "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.12,<1", "pip-tools>=7,<8", "setuptools>=75"]
report = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "matplotlib>=3.10,<4"]

[project.scripts]
ifte0007 = "ifte0007.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
