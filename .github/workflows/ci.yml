name: coursework-validation

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-03
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-11-03
        with:
          python-version: '3.12'
      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          python tools/check_repository.py
      - name: Offline calculation and integrity tests
        run: |
          python -m pytest -q
          python -m ifte0007 demo
          python tools/check_notebook.py
